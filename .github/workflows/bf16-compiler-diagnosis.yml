name: BF16 compiler diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
      - uses: actions/checkout@v5
        with:
          path: candidate
          ref: 8a66b99333831c7a871de86519563930feb0bdb2
      - uses: actions/checkout@v5
        with:
          path: old
          ref: 91dd64ae1a4b4bffa534514f10aeaba7e9671574
      - uses: actions/checkout@v5
        with:
          path: published
          ref: 1440ca7555e492ae7c2a17cde7cb3ffe6c07b7b5
      - name: Admit exact hardware
        run: |
          python3 candidate/scripts/bf16-compiler/admit.py arm
          python3 -c 'import json; assert json.load(open("evidence/hardware-admission.json"))["accepted"]'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment
        run: |
          { uname -a; lscpu; java -version; java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version; } > evidence/host.txt 2>&1
      - name: Build immutable artifacts
        run: |
          for tree in candidate old published; do
            (cd "$tree" && ./gradlew :vectors-core:jar --max-workers=2 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME")
          done
      - name: Fixed three-block checkpoint 0
        run: python3 harness/scripts/bf16-compilation-modes/run.py candidate old published evidence --segment 0
      - name: Retain checkpoint 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compilation-modes-0
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-0/
          retention-days: 30
      - name: Fixed three-block checkpoint 1
        run: python3 harness/scripts/bf16-compilation-modes/run.py candidate old published evidence --segment 1
      - name: Retain checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compilation-modes-1
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-1/
          retention-days: 30
      - name: Fixed three-block checkpoint 2
        run: python3 harness/scripts/bf16-compilation-modes/run.py candidate old published evidence --segment 2
      - name: Retain checkpoint 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compilation-modes-2
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-2/
          retention-days: 30
      - name: Fixed three-block checkpoint 3
        run: python3 harness/scripts/bf16-compilation-modes/run.py candidate old published evidence --segment 3
      - name: Retain checkpoint 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compilation-modes-3
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-3/
          retention-days: 30
      - name: Fixed three-block checkpoint 4
        run: python3 harness/scripts/bf16-compilation-modes/run.py candidate old published evidence --segment 4
      - name: Retain checkpoint 4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compilation-modes-4
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-4/
          retention-days: 30
