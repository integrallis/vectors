name: BF16 compiler diagnosis
on:
  push:
    branches: [fix/bonsai-activation]
    paths:
      - scripts/bf16-compiler/**
      - .github/workflows/bf16-compiler-diagnosis.yml
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            runner: ubuntu-24.04-arm
          - arch: x86
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - name: Admit hardware before measured work
        id: hardware
        run: python3 candidate/scripts/bf16-compiler/admit.py ${{ matrix.arch }}
      - uses: actions/checkout@v5
        if: steps.hardware.outputs.accepted == 'true'
        with:
          ref: 1440ca7555e492ae7c2a17cde7cb3ffe6c07b7b5
          path: baseline
      - uses: actions/setup-java@v5
        if: steps.hardware.outputs.accepted == 'true'
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.hardware.outputs.accepted == 'true'
      - name: Record environment
        if: steps.hardware.outputs.accepted == 'true'
        run: |
          { uname -a; lscpu; java -version; java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version; } > evidence/host.txt 2>&1
      - name: Build candidate
        if: steps.hardware.outputs.accepted == 'true'
        working-directory: candidate
        run: ./gradlew :vectors-core:jar --max-workers=2 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Build published
        if: steps.hardware.outputs.accepted == 'true'
        working-directory: baseline
        run: ./gradlew :vectors-core:jar --max-workers=2 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Fixed compiler checkpoint 0
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 0
      - name: Retain checkpoint 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compiler-${{ matrix.arch }}-0
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-0/
          retention-days: 30
      - name: Fixed compiler checkpoint 1
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 1
      - name: Retain checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-compiler-${{ matrix.arch }}-1
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-1/
          retention-days: 30
      - name: Fixed compiler checkpoint 2
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 2
      - name: Retain checkpoint 2
