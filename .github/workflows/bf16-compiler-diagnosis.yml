name: BF16 compiler diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch frozen external diagnostic payload
        env:
          PAYLOAD_URL: ${{ secrets.BF16_EXTERNAL_PAYLOAD_URL }}
        run: |
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o payload.tar.gz
          echo "67e62954d7be97b7a8279eedf5c254495545af5dda1b96c59f4788f7c9bb2cd5  payload.tar.gz" | sha256sum -c -
          tar -xzf payload.tar.gz
          mkdir -p evidence
          { uname -a; lscpu; java -version; java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version; } > evidence/host.txt 2>&1
      - name: Fixed four-pair checkpoint 0
        run: python3 payload/run.py evidence 0
      - name: Retain checkpoint 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-0
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-0/
          retention-days: 30
      - name: Fixed four-pair checkpoint 1
        run: python3 payload/run.py evidence 1
      - name: Retain checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-1
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-1/
          retention-days: 30
      - name: Fixed four-pair checkpoint 2
        run: python3 payload/run.py evidence 2
      - name: Retain checkpoint 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-2
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-2/
          retention-days: 30
      - name: Fixed four-pair checkpoint 3
        run: python3 payload/run.py evidence 3
      - name: Retain checkpoint 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-3
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-3/
          retention-days: 30
      - name: Fixed four-pair checkpoint 4
        run: python3 payload/run.py evidence 4
      - name: Retain checkpoint 4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-4
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-4/
          retention-days: 30
      - name: Fixed four-pair checkpoint 5
        run: python3 payload/run.py evidence 5
      - name: Retain checkpoint 5
        if: always()
