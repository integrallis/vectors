        with:
          name: bf16-row-boundary-5
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-5/
          retention-days: 30
      - name: Fixed four-pair checkpoint 6
        run: python3 payload/run.py evidence 6
      - name: Retain checkpoint 6
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-row-boundary-6
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-6/
          retention-days: 30
      - name: Fixed four-pair checkpoint 7
        run: python3 payload/run.py evidence 7
      - name: Retain checkpoint 7
        if: always()
