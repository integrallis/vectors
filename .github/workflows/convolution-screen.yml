name: Convolution fixed screen
on:
  push:
    branches: [fix/bonsai-activation]
    paths:
      - scripts/convolution-screen/**
      - .github/workflows/convolution-screen.yml
permissions:
  contents: read
jobs:
  paired:
    name: Convolution screen ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/checkout@v5
        with:
          ref: 1440ca7555e492ae7c2a17cde7cb3ffe6c07b7b5
          path: published
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment and validate protocol
        run: |
          mkdir -p evidence
          { uname -a; lscpu; java -version; } > evidence/host.txt 2>&1
          python3 -m unittest discover -s candidate/scripts/convolution-screen -p 'test_*.py'
      - name: Build candidate and numerical contracts
        working-directory: candidate
        run: ./gradlew :vectors-core:jar :vectors-core:test --tests '*ConvolutionSiluContractTest' --tests '*BonsaiActivationSequenceTest' --tests '*ConvolutionPolynomialAccuracyTest' --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Build published control
        working-directory: published
        run: ./gradlew :vectors-core:jar --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Fixed pair 0
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 0
      - name: Retain pair 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-screen-${{ matrix.arch }}-0
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-0/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 1
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 1
      - name: Retain pair 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-screen-${{ matrix.arch }}-1
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-1/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 2
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 2
      - name: Retain pair 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-screen-${{ matrix.arch }}-2
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-2/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 3
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 3
      - name: Retain pair 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-screen-${{ matrix.arch }}-3
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-3/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Retain numerical reports and actual candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-screen-tests-${{ matrix.arch }}
          path: |
            candidate/vectors-core/build/test-results/test/
            candidate/vectors-core/build/reports/bonsai-activation-sequence/
            candidate/vectors-core/build/libs/*.jar
          retention-days: 30
  analyze:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: convolution-screen-*
          path: artifacts
      - name: Evaluate complete frozen screen
        run: python3 scripts/convolution-screen/analyze.py artifacts analysis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: convolution-screen-analysis
          path: analysis/
          retention-days: 30
