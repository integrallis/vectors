name: MFCQI

# Multi-Factor Code Quality Index (https://github.com/integrallis/mfcqi-java). Replaces CodeQL as
# the code-quality signal: computes the aggregate score over the published-library production
# sources plus a per-module score, and commits the shields.io endpoint badge JSONs on push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mfcqi:
    name: MFCQI score and badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Derived from publishedModuleNames rather than listed here. The hand-written list this
      # replaces had drifted to 15 of 33 published modules, so more than half the published surface
      # was missing from the score this workflow badges.
      - name: Stage published-library production sources (aggregate score)
        run: |
          STAGE="${RUNNER_TEMP}/mfcqi-src"
          ./gradlew stageAggregateMfcqiSources -Pmfcqi.stageDir="$STAGE" --no-daemon
          echo "MFCQI_STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "staged $(find "$STAGE" -name '*.java' | wc -l) source files"

      - name: Enforce MFCQI gates and generate badges (aggregate + per-module)
        run: ./gradlew mfcqiGate mfcqiBadge -Pmfcqi.sourceDir="$MFCQI_STAGE" --no-daemon

      - name: Commit badge updates
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add '.github/badges/mfcqi.json' 'vectors-*/.github/badges/mfcqi.json'
          if ! git diff --staged --quiet; then
            git commit -m "chore: update MFCQI badges [skip ci]"
            git push
          fi
