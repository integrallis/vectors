            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-6/
            evidence/compile*
          retention-days: 30
      - name: Fixed-count checkpoint 7
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/convolution-precision/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 7
      - name: Retain checkpoint 7
        if: always() && steps.hardware.outputs.accepted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: convolution-precision-${{ matrix.arch }}-${{ matrix.attempt }}-7
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-7/
            evidence/compile*
          retention-days: 30
  analyze:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: convolution-precision-*
          path: artifacts
      - run: python3 scripts/convolution-precision/analyze.py artifacts analysis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: convolution-precision-analysis
          path: analysis/
          retention-days: 30
