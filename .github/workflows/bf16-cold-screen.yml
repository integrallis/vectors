name: Bonsai BF16 compact cold diagnostic
on:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/bf16-cold-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable external diagnostic payload
        env:
          PAYLOAD_URL: ${{ secrets.BF16_COLD_SCREEN_PAYLOAD_URL }}
        run: |
          curl --fail --location --silent --show-error "$PAYLOAD_URL" -o payload.tar.gz
          echo '9b7bbe8006c30d757796bf8d5b214dad463950c67e697a00a868d36431f3089f  payload.tar.gz' | sha256sum -c -
          tar xzf payload.tar.gz
          mkdir -p evidence
          { uname -a; lscpu; java -version; java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version; } > evidence/host.txt 2>&1
      - name: Verify exact artifacts and cold hot numeric contract
        run: python3 payload/run.py prepare
      - name: Fixed triplet 0
        run: python3 payload/run.py 0
      - name: Retain triplet 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-cold-${{ matrix.arch }}-0
          path: evidence/
          retention-days: 30
      - name: Fixed triplet 1
        run: python3 payload/run.py 1
      - name: Retain triplet 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-cold-${{ matrix.arch }}-1
          path: evidence/
          retention-days: 30
      - name: Fixed triplet 2
        run: python3 payload/run.py 2
      - name: Retain triplet 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-cold-${{ matrix.arch }}-2
          path: evidence/
          retention-days: 30
      - name: Fixed triplet 3
        run: python3 payload/run.py 3
      - name: Retain triplet 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-cold-${{ matrix.arch }}-3
          path: evidence/
          retention-days: 30
