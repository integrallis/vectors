name: BF16 ARM Clippy code correspondence
on:
  workflow_dispatch:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/bf16-arm-clippy-correspondence.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Fetch immutable external native sources
        env:
          PAYLOAD_URL: ${{ secrets.BF16_ARM_CLIPPY_PAYLOAD_URL }}
        shell: bash
        run: |
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '2e0cebc9764622f86f243a740d524e2f7bc50e5da9aedab7235d228097341aaf  payload.tar.gz' | shasum -a 256 -c -
          tar -xzf payload.tar.gz
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Compare full native binaries and run ARM lint and tests
        run: python3 payload/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-clippy-${{ matrix.runner }}
          path: evidence/
          if-no-files-found: error
