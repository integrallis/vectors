name: Deploy Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-build]

permissions:
  contents: read
  pages: write
  id-token: write
  # To list this run's artifacts in "Wait for the Pages artifact to be listed".
  actions: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle wrapper
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Set Release Version in Docs
        run: |
          VERSION=$(cat gradle.properties | grep "version" | cut -d'=' -f2 | tr -d ' ')
          echo "Setting documentation version to $VERSION"
          sed -i "s/display_version: '.*'/display_version: '$VERSION'/" docs/content/antora.yml
          sed -i "s/vectors-version: '.*'/vectors-version: '$VERSION'/" docs/content/antora.yml

      - name: Build Documentation
        run: ./gradlew :docs:build --console=plain

      - name: Assemble Pages site (marketing landing at root, Antora docs under /docs)
        run: |
          rm -rf docs/build/public
          mkdir -p docs/build/public
          cp -R docs/landing/. docs/build/public/
          cp -R docs/build/site docs/build/public/docs
          touch docs/build/public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/build/public'

      # deploy-pages looks the artifact up through the run's artifact listing exactly once, with no
      # retry, and that listing lags the upload. In the three failed runs of 2026-11-17 and
      # 2026-11-20 the lookup came 0.3-0.5s after "successfully finalized" and returned
      # "Found 0 artifact(s)". Ask the same listing until it has the artifact, twice in a row,
      # before handing over.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=0
          for attempt in $(seq 1 60); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$count" -ge 1 ]; then
              seen=$((seen + 1))
              echo "attempt $attempt: listed ($seen in a row)"
              [ "$seen" -ge 2 ] && exit 0
            else
              seen=0
              echo "attempt $attempt: not listed yet"
            fi
            sleep 2
          done
          echo "::error::The github-pages artifact was uploaded but never appeared in the run's artifact listing."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
