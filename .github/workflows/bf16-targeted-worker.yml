      - name: Fixed-count checkpoint 4
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-targeted-precision/run.py 4
      - name: Retain checkpoint 4
        if: always() && steps.hardware.outputs.accepted == 'true'
