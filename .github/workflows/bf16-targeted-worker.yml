name: BF16 targeted precision workers
on:
  workflow_call:
    inputs:
      attempts:
        type: string
        required: true
    secrets:
      leases:
        required: true
      payload:
        required: true
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        attempt: ${{ fromJSON(inputs.attempts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Select independent frozen protocol
        run: cp candidate/scripts/bf16-targeted-precision/protocol.json candidate/scripts/convolution-precision/protocol.json
      - name: Admit declared SIMD capability before build or measurements
        id: hardware
        env:
          CONVOLUTION_ADMISSION_LEASES: ${{ secrets.leases }}
        run: python3 candidate/scripts/convolution-precision/admit.py ${{ 'x86' }} ${{ matrix.attempt }}
      - name: Retain hardware admission
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-targeted-admission-${{ 'x86' }}-${{ matrix.attempt }}
          path: evidence/hardware-admission.json
          retention-days: 30
      - name: Fetch the immutable final BF16 artifacts and unchanged benchmark
        if: steps.hardware.outputs.accepted == 'true'
        env:
          PAYLOAD_URL: ${{ secrets.payload }}
        run: |
          curl --fail --location --silent --show-error "$PAYLOAD_URL" -o payload.tar.gz
          echo 'c691b66eb4bac8f10bbc979e5e07950b05c27a4ec18ca118efc897f92b6b8bde  payload.tar.gz' | sha256sum -c -
          tar xzf payload.tar.gz
      - name: Record environment
        if: steps.hardware.outputs.accepted == 'true'
        run: |
          { uname -a; lscpu; java -version; java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version; } > evidence/host.txt 2>&1
      - name: Fixed-count checkpoint 0
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-targeted-precision/run.py 0
      - name: Retain checkpoint 0
        if: always() && steps.hardware.outputs.accepted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bf16-targeted-${{ 'x86' }}-${{ matrix.attempt }}-0
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-0/
            evidence/compile*
          retention-days: 30
      - name: Fixed-count checkpoint 1
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-targeted-precision/run.py 1
      - name: Retain checkpoint 1
        if: always() && steps.hardware.outputs.accepted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bf16-targeted-${{ 'x86' }}-${{ matrix.attempt }}-1
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
            evidence/segment-1/
            evidence/compile*
          retention-days: 30
      - name: Fixed-count checkpoint 2
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-targeted-precision/run.py 2
      - name: Retain checkpoint 2
        if: always() && steps.hardware.outputs.accepted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bf16-targeted-${{ 'x86' }}-${{ matrix.attempt }}-2
          path: |
            evidence/manifest.json
            evidence/hardware-admission.json
            evidence/host.txt
