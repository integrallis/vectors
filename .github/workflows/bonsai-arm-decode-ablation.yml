name: Bonsai ARM decode capability attribution
on:
  workflow_dispatch:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/bonsai-arm-decode-ablation.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch immutable external diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.BONSAI_ARM_DECODE_PAYLOAD_URL }}
        run: |
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '3f1a3f5af464cdfd2ec7e8ed2ddfdc3bd0729064a6f808e3eac5799e30194d54  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python3 payload/fetch_weights.py "$RUNNER_TEMP/bonsai2.gguf"
          python3 payload/run_decode.py prepare
      - name: route
        timeout-minutes: 35
        run: python3 payload/run_decode.py 'route' --weights "$RUNNER_TEMP/bonsai2.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-decode-capabilities-0
          path: evidence/
          if-no-files-found: error
      - name: round:0
        timeout-minutes: 35
        run: python3 payload/run_decode.py 'round:0' --weights "$RUNNER_TEMP/bonsai2.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-decode-capabilities-1
          path: evidence/
          if-no-files-found: error
      - name: round:1
        timeout-minutes: 35
        run: python3 payload/run_decode.py 'round:1' --weights "$RUNNER_TEMP/bonsai2.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-decode-capabilities-2
          path: evidence/
          if-no-files-found: error
      - name: finish
        timeout-minutes: 35
        run: python3 payload/run_decode.py 'finish' --weights "$RUNNER_TEMP/bonsai2.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-decode-capabilities-3
          path: evidence/
          if-no-files-found: error
