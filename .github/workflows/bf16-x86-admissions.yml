        with:
          name: bf16-admission-${{ matrix.attempt }}-5
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-5/
          retention-days: 30
      - name: Fixed compiler checkpoint 6
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 6
      - name: Retain checkpoint 6
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-admission-${{ matrix.attempt }}-6
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-6/
          retention-days: 30
      - name: Fixed compiler checkpoint 7
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 7
      - name: Retain checkpoint 7
