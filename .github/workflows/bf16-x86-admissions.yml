          name: bf16-admission-${{ matrix.attempt }}-3
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-3/
          retention-days: 30
      - name: Fixed compiler checkpoint 4
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 4
      - name: Retain checkpoint 4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bf16-admission-${{ matrix.attempt }}-4
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/segment-4/
          retention-days: 30
      - name: Fixed compiler checkpoint 5
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/bf16-compiler/run.py candidate baseline evidence --arch ${{ matrix.arch }} --segment 5
      - name: Retain checkpoint 5
        if: always()
