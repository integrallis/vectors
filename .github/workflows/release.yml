name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate signing, POMs, and bundle without publishing)"
        type: boolean
        default: true
      skip_deploy:
        description: "Skip Maven Central deployment and only create or refresh the GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release to Maven Central and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install native BLAS (Vectors Studio)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Build, test, and stage artifacts
        run: >
          ./gradlew clean spotlessCheck build :docs:build
          :vectors-bench:recallGate complianceCheck publish
          --no-daemon --stacktrace

      - name: Resolve project version
        id: version
        run: echo "version=$(grep -E '^version' gradle.properties | sed -E 's/.*=[[:space:]]*//')" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::Release tag $GITHUB_REF does not match project version v$VERSION"
            exit 1
          fi

      - name: Prepare staged-release notebook classpath
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./gradlew prepareNotebookClasspath
          -PnotebookMode=release
          -PnotebookVersion="$VERSION"
          -PnotebookRepository="$GITHUB_WORKSPACE/build/staging-deploy"

      - name: Prepare writable notebook output
        run: install -d -m 0777 build/notebooks/executed

      - name: Build JJava notebook image
        working-directory: notebooks
        run: docker compose build

      - name: Execute notebooks against staged artifacts
        working-directory: notebooks
        env:
          VECTORS_NOTEBOOK_PREPARE: "false"
          VECTORS_NOTEBOOK_MODE: release
        run: >
          docker compose run --rm --no-deps jupyter
          bash /home/jovyan/work/vectors/notebooks/scripts/test-notebooks.sh

      - name: Reject snapshot release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Release version must not end in -SNAPSHOT: $VERSION"
            exit 1
          fi

      - name: Validate Maven Central deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy --dry-run
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.skip_deploy) }}
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify Maven Central publication
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.skip_deploy) }}
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deployment_id="$(sed -n 's/^deployMavenCentralSonatypeDeploymentId=//p' \
            out/jreleaser/output.properties)"
          if [[ ! "$deployment_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::JReleaser did not record a valid Maven Central deployment ID"
            exit 1
          fi

          auth="$(printf '%s:%s' "$MAVENCENTRAL_USERNAME" "$MAVENCENTRAL_PASSWORD" \
            | base64 | tr -d '\n')"
          published=false
          for attempt in $(seq 1 120); do
            response="$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id")"
            state="$(jq -er '.deploymentState' <<<"$response")"
            echo "Maven Central deployment $deployment_id: $state ($attempt/120)"
            case "$state" in
              PUBLISHED)
                published=true
                break
                ;;
              FAILED)
                jq -c '.errors // []' <<<"$response"
                echo "::error::Maven Central deployment $deployment_id failed"
                exit 1
                ;;
              PENDING|VALIDATING|VALIDATED|PUBLISHING)
                sleep 30
                ;;
              *)
                echo "::error::Unknown Maven Central deployment state: $state"
                exit 1
                ;;
            esac
          done
          if [[ "$published" != true ]]; then
            echo "::error::Maven Central deployment $deployment_id did not reach PUBLISHED"
            exit 1
          fi

          artifact_url="https://repo1.maven.org/maven2/com/integrallis/vectors-core/$VERSION/vectors-core-$VERSION.pom"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "$artifact_url?release=$GITHUB_RUN_ID-$attempt" --output /dev/null; then
              echo "Verified published artifact: $artifact_url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published deployment did not synchronize to $artifact_url"
          exit 1

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "vectors $VERSION" \
              --generate-notes
          fi

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-logs
          if-no-files-found: ignore
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
