name: Pinned x86 warmed EXP numerical compatibility
on:
  workflow_dispatch:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/svml-exp-compatibility.yml]
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Fetch frozen external diagnostic
        env:
          PAYLOAD_URL: ${{ secrets.SVML_EXP_COMPATIBILITY_URL }}
        run: |
          set -euo pipefail
          mkdir -p proof-out
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '9778ea0d6a7e88f111b21494643f042c9ab588bdbd1dbd77876735f0bc6e2874  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          uname -a > proof-out/host.txt
          lscpu >> proof-out/host.txt
          java -version 2>> proof-out/host.txt
          java -XX:+PrintFlagsFinal -version >> proof-out/host.txt 2>&1
          sha256sum "$JAVA_HOME/lib/libjsvml.so" "$JAVA_HOME/lib/modules" > proof-out/jdk-library-sha256.txt
          objdump --dynamic-syms "$JAVA_HOME/lib/libjsvml.so" > proof-out/jdk-library-symbols.txt
          grep '__jsvml_expf8_ha_l9' proof-out/jdk-library-symbols.txt
      - name: Compare exact ordinary-domain arithmetic
        run: python3 payload/run.py
      - name: Verify actual compiled oracle
        if: always()
        run: grep 'runtime_call __jsvml_expf8_ha_l9' proof-out/codegen.stdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svml-exp-compatibility-x86
          path: |
            proof-out/
            payload/PROTOCOL.json
            payload/files.json
          if-no-files-found: error
          retention-days: 30
