name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-portability:
    name: Core portability (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: arm64
            runner: ubuntu-24.04-arm
            java_options: ''
          - mode: x86-128
            runner: ubuntu-latest
            java_options: '-Dvectors.maxBits=128'
          - mode: x86-scalar
            runner: ubuntu-latest
            java_options: '-Dvectors.forceScalar=true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Record hardware and source
        run: |
          mkdir -p build/core-portability
          { git rev-parse HEAD; uname -a; lscpu; java -version; } > build/core-portability/host.txt 2>&1
      - name: Execute core contracts
        env:
          JAVA_TOOL_OPTIONS: ${{ matrix.java_options }}
        run: ./gradlew :vectors-core:test --rerun-tasks --max-workers=4 --no-daemon
      - name: Retain portability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-portability-${{ matrix.mode }}
          path: |
            build/core-portability/
            vectors-core/build/test-results/test/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # vectors-studio-core's Smile PCA/t-SNE/UMAP projections bind a system LAPACK via the Java
      # FFM API (smile.linalg), which dlopens libopenblas.so at runtime. The runner has no BLAS by
      # default, so those tests fail with NoClassDefFoundError without this.
      - name: Install native BLAS (Smile LAPACK backend)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev libarpack2-dev

      - name: Build + Test
        run: ./gradlew spotlessCheck build -x :docs:build

      # S3 compare-and-swap and Studio SSE/HTTP workflows are outside the default test tags.
      - name: Storage and Studio integration tests
        run: ./gradlew :vectors-storage:integrationTest :vectors-studio-web:integrationTest

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build Documentation
        run: ./gradlew :docs:build

      # P1.1 recall@10 regression gate: deterministic, no dataset download. Fails the build if
      # recall on any gated index (HNSW/VAMANA/IVF_FLAT/IVF_PQ) drops > 0.005 vs the committed
      # baseline. Re-baseline an intentional change with -Drecall.gate.mode=record.
      - name: Recall Regression Gate
        run: ./gradlew :vectors-bench:recallGate

      - name: Generate SBOM
        run: ./gradlew cyclonedxDirectBom

      - name: Compliance Check
        run: ./gradlew complianceCheck verifyLockfiles verifyGithubWorkflows

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: '*/build/reports/cyclonedx-direct/bom.json'
          retention-days: 90

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          retention-days: 30

  notebooks:
    name: Execute Java Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare source classpath
        run: ./gradlew prepareNotebookClasspath -PnotebookMode=source

      - name: Prepare writable notebook output
        run: install -d -m 0777 build/notebooks/executed

      - name: Build JJava image
        working-directory: notebooks
        run: docker compose build

      - name: Execute and validate all notebooks
        working-directory: notebooks
        env:
          VECTORS_NOTEBOOK_PREPARE: "false"
          VECTORS_NOTEBOOK_MODE: source
        run: >
          docker compose run --rm --no-deps jupyter
          bash /home/jovyan/work/vectors/notebooks/scripts/test-notebooks.sh

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: build/notebooks/executed/
          retention-days: 14

  studio-browser:
    name: Studio browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install projection and browser runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libarpack2-dev
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build Studio distribution
        run: ./gradlew :vectors-studio-web:installDist
      - name: Exercise collection and projection workflows
        run: |
          mkdir -p build/studio-browser
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
            --class-path 'vectors-studio-web/build/install/vectors-studio-web/lib/*' \
            vectors-studio-web/smoke/StudioFixture.java > build/studio-browser/server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8288/health; then break; fi
            kill -0 "$fixture_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8288/health
          python vectors-studio-web/smoke/browser.py --output build/studio-browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser
          path: build/studio-browser/
          retention-days: 30
