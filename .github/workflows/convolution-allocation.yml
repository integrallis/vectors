name: Convolution allocation regression
on:
  push:
    branches: [fix/bonsai-activation]
    paths:
      - scripts/convolution-allocation/**
      - .github/workflows/convolution-allocation.yml
permissions:
  contents: read
jobs:
  paired:
    name: Convolution ${{ matrix.arch }} JDK${{ matrix.jdk }} host${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
        jdk: ['25.0.3', '25']
        host: [0, 1]
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/checkout@v5
        with:
          ref: 1440ca7555e492ae7c2a17cde7cb3ffe6c07b7b5
          path: published
      - uses: actions/checkout@v5
        with:
          ref: 91dd64ae1a4b4bffa534514f10aeaba7e9671574
          path: regressed
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Record environment and validate protocol
        run: |
          mkdir -p evidence
          { uname -a; lscpu; java -version; } > evidence/host.txt 2>&1
          python3 -m unittest discover -s candidate/scripts/convolution-allocation -p 'test_*.py'
      - name: Build candidate and numerical contracts
        working-directory: candidate
        run: ./gradlew :vectors-core:jar :vectors-core:test --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Build published control
        working-directory: published
        run: ./gradlew :vectors-core:jar --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Build regressed control
        working-directory: regressed
        run: ./gradlew :vectors-core:jar --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Record measurement runtime
        run: java -version > evidence/measurement-java.txt 2>&1
      - name: Fixed paired block 0
        run: python3 candidate/scripts/convolution-allocation/run.py --arch ${{ matrix.arch }} --jdk ${{ matrix.jdk }} --host ${{ matrix.host }} --segment 0
      - name: Retain block 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-${{ matrix.arch }}-${{ matrix.jdk }}-${{ matrix.host }}-0
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/measurement-java.txt
            evidence/segment-0/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed paired block 1
        run: python3 candidate/scripts/convolution-allocation/run.py --arch ${{ matrix.arch }} --jdk ${{ matrix.jdk }} --host ${{ matrix.host }} --segment 1
      - name: Retain block 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-${{ matrix.arch }}-${{ matrix.jdk }}-${{ matrix.host }}-1
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/measurement-java.txt
            evidence/segment-1/
          retention-days: 30
      - name: Fixed paired block 2
        run: python3 candidate/scripts/convolution-allocation/run.py --arch ${{ matrix.arch }} --jdk ${{ matrix.jdk }} --host ${{ matrix.host }} --segment 2
      - name: Retain block 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-${{ matrix.arch }}-${{ matrix.jdk }}-${{ matrix.host }}-2
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/measurement-java.txt
            evidence/segment-2/
          retention-days: 30
      - name: Fixed paired block 3
        run: python3 candidate/scripts/convolution-allocation/run.py --arch ${{ matrix.arch }} --jdk ${{ matrix.jdk }} --host ${{ matrix.host }} --segment 3
      - name: Retain block 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-${{ matrix.arch }}-${{ matrix.jdk }}-${{ matrix.host }}-3
          path: |
            evidence/manifest.json
            evidence/host.txt
            evidence/measurement-java.txt
            evidence/segment-3/
          retention-days: 30
      - name: Retain numerical reports and actual candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-tests-${{ matrix.arch }}-${{ matrix.jdk }}-${{ matrix.host }}
          path: |
            candidate/vectors-core/build/test-results/test/
            candidate/vectors-core/build/reports/bonsai-activation-sequence/
            candidate/vectors-core/build/libs/*.jar
          retention-days: 30
  analyze:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: convolution-*
          path: artifacts
      - name: Evaluate complete frozen cohort
        run: python3 scripts/convolution-allocation/analyze.py artifacts analysis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: convolution-analysis
          path: analysis/
          retention-days: 30
