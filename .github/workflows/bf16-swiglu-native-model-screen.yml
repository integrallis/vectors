        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-7
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: timing-0
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
