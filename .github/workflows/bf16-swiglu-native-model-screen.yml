        run: |
          arm=$(python3 -c 'import json,os; print(json.load(open("payload/protocol.json"))["orders"][int(os.environ["PAIR"])][2])')
          python3 payload/model-run.py "$ARCH" "$PAIR" "plain:$arm"
      - name: Retain checkpoint 3
