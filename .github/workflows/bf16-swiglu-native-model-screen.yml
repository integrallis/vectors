        run: |
          arm=$(python3 -c 'import json,os; print(json.load(open("payload/protocol.json"))["orders"][int(os.environ["PAIR"])][1])')
          python3 payload/model-run.py "$ARCH" "$PAIR" "timing:$arm"
      - name: Retain checkpoint 9
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-9
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: timing-2
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
          PAIR: ${{ matrix.pair }}
        run: |
          arm=$(python3 -c 'import json,os; print(json.load(open("payload/protocol.json"))["orders"][int(os.environ["PAIR"])][2])')
          python3 payload/model-run.py "$ARCH" "$PAIR" "timing:$arm"
      - name: Retain checkpoint 10
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-10
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: finish
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
          PAIR: ${{ matrix.pair }}
        run: |
          python3 payload/model-run.py "$ARCH" "$PAIR" 'finish'
      - name: Retain checkpoint 11
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-11
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
