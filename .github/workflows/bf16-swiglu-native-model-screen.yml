          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: pure-reference
        timeout-minutes: 82
        env:
