name: Bonsai combined native BF16 and SwiGLU causal screen
on:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/bf16-swiglu-native-model-screen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {arch: x86, pair: 0}
          - {arch: arm, pair: 0}
          - {arch: x86, pair: 1}
          - {arch: arm, pair: 1}
          - {arch: x86, pair: 2}
          - {arch: arm, pair: 2}
          - {arch: x86, pair: 3}
          - {arch: arm, pair: 3}
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          repository: integrallis/models
          ref: 5344b5a2ff84a27548f0f2c4840c24f22d73c32d
          path: models
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch immutable external causal payload
        env:
          PAYLOAD_URL: ${{ secrets.BF16_SWIGLU_NATIVE_MODEL_PAYLOAD_URL }}
        run: |
          curl --fail --location --silent --show-error "$PAYLOAD_URL" -o payload.tar.gz
          echo '0194b8fca29a628685c42f2bb2087be6c375ae2c17db42c9116e817e92d7d258  payload.tar.gz' | sha256sum -c -
          tar xzf payload.tar.gz
          mkdir -p evidence
          { uname -a; lscpu; java -version; } > evidence/host.txt 2>&1
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build exact Models runtime
        working-directory: models
        run: ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime --init-script ../payload/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2
      - name: prepare
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
          PAIR: ${{ matrix.pair }}
        run: |
          python3 payload/model-run.py "$ARCH" "$PAIR" 'prepare'
      - name: Retain checkpoint 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-0
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: plain-0
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
          PAIR: ${{ matrix.pair }}
        run: |
          arm=$(python3 -c 'import json,os; print(json.load(open("payload/protocol.json"))["orders"][int(os.environ["PAIR"])][0])')
          python3 payload/model-run.py "$ARCH" "$PAIR" "plain:$arm"
      - name: Retain checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-1
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: plain-1
        timeout-minutes: 82
        env:
          ARCH: ${{ matrix.arch }}
          PAIR: ${{ matrix.pair }}
        run: |
          arm=$(python3 -c 'import json,os; print(json.load(open("payload/protocol.json"))["orders"][int(os.environ["PAIR"])][1])')
          python3 payload/model-run.py "$ARCH" "$PAIR" "plain:$arm"
      - name: Retain checkpoint 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-native-model-${{ matrix.arch }}-${{ matrix.pair }}-2
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.txt
            evidence/*.so
            evidence/STATUS
          retention-days: 30
      - name: plain-2
        timeout-minutes: 82
