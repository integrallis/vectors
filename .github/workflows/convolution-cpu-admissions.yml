name: Convolution exact CPU admissions
on:
  push:
    branches: [fix/bonsai-activation]
    paths:
      - .github/workflows/convolution-cpu-admissions.yml
permissions:
  contents: read
jobs:
  paired:
    name: Convolution9V74 attempt${{ matrix.attempt }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        attempt: [0, 1, 2, 3, 4, 5, 6, 7]
        arch: [x86]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
          ref: a32616bda274414d16fc08eb9b4a31d6a9c755cc
      - name: Admit exact CPU before work
        id: hardware
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,subprocess,os
          from pathlib import Path
          rows=json.loads(subprocess.check_output(['lscpu','-J']))['lscpu']
          cpu=next(r['data'] for r in rows if r['field'].rstrip(':')=='Model name')
          accepted=cpu=='AMD EPYC 9V74 80-Core Processor'
          Path('evidence/hardware-admission.json').write_text(json.dumps({'cpu':cpu,'accepted':accepted,'attempt':${{ matrix.attempt }},'attemptCount':8,'scope':'All admitted hosts run four unchanged pairs; all mismatches metadata only; firstpair rejection remains failure even when remaining diagnostic pairs are retained','lscpu':rows},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream: stream.write('accepted='+str(accepted).lower()+'\n')
          PYCODE
      - uses: actions/checkout@v5
        if: steps.hardware.outputs.accepted == 'true'
        with:
          ref: 1440ca7555e492ae7c2a17cde7cb3ffe6c07b7b5
          path: published
      - uses: actions/setup-java@v5
        if: steps.hardware.outputs.accepted == 'true'
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.hardware.outputs.accepted == 'true'
      - name: Record environment and validate protocol
        if: steps.hardware.outputs.accepted == 'true'
        run: |
          mkdir -p evidence
          { uname -a; lscpu; java -version; } > evidence/host.txt 2>&1
          python3 -m unittest discover -s candidate/scripts/convolution-screen -p 'test_*.py'
      - name: Build candidate and numerical contracts
        id: candidatebuild
        if: steps.hardware.outputs.accepted == 'true'
        working-directory: candidate
        run: ./gradlew :vectors-core:jar :vectors-core:test --tests '*ConvolutionSiluContractTest' --tests '*BonsaiActivationSequenceTest' --tests '*ConvolutionPolynomialAccuracyTest' --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Build published control
        id: publishedbuild
        if: steps.hardware.outputs.accepted == 'true'
        working-directory: published
        run: ./gradlew :vectors-core:jar --max-workers=4 --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Fixed pair 0
        if: always() && steps.hardware.outputs.accepted == 'true' && steps.candidatebuild.outcome == 'success' && steps.publishedbuild.outcome == 'success'
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 0
      - name: Retain pair 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-${{ matrix.arch }}-0
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/first-pair-screen.json
            evidence/segment-0/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 1
        if: always() && steps.hardware.outputs.accepted == 'true' && steps.candidatebuild.outcome == 'success' && steps.publishedbuild.outcome == 'success'
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 1
      - name: Retain pair 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-${{ matrix.arch }}-1
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/first-pair-screen.json
            evidence/segment-1/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 2
        if: always() && steps.hardware.outputs.accepted == 'true' && steps.candidatebuild.outcome == 'success' && steps.publishedbuild.outcome == 'success'
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 2
      - name: Retain pair 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-${{ matrix.arch }}-2
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/first-pair-screen.json
            evidence/segment-2/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Fixed pair 3
        if: always() && steps.hardware.outputs.accepted == 'true' && steps.candidatebuild.outcome == 'success' && steps.publishedbuild.outcome == 'success'
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 3
      - name: Retain pair 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-${{ matrix.arch }}-3
          path: |
            evidence/hardware-admission.json
            evidence/manifest.json
            evidence/host.txt
            evidence/first-pair-screen.json
            evidence/segment-3/
            evidence/proof/
            evidence/compile*
          retention-days: 30
      - name: Exhaustive actual-artifact numerical proof
        if: steps.hardware.outputs.accepted == 'true'
        run: python3 candidate/scripts/convolution-screen/run.py --arch ${{ matrix.arch }} --jdk 25.0.3 --host 0 --segment 4
      - name: Retain exhaustive proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-proof-${{ matrix.arch }}
          path: evidence/proof/
          retention-days: 30
      - name: Retain numerical reports and actual candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convolution-admission-${{ matrix.attempt }}-tests-${{ matrix.arch }}
          path: |
            candidate/vectors-core/build/test-results/test/
            candidate/vectors-core/build/reports/bonsai-activation-sequence/
            candidate/vectors-core/build/libs/*.jar
          retention-days: 30
