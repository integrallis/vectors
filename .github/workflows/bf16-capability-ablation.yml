name: Bonsai BF16 capability allocation ablation
on:
  workflow_dispatch:
  push:
    branches: [fix/bonsai-activation]
    paths: [.github/workflows/bf16-capability-ablation.yml]
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x86
            pair: 0
            runner: ubuntu-24.04
          - arch: arm
            pair: 0
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      ARCH: ${{ matrix.arch }}
      PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch immutable external source and harness
        env:
          PAYLOAD_URL: ${{ secrets.BF16_CAPABILITY_ABLATION_PAYLOAD_URL }}
        run: |
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '46164dd46c0d1e812656e617252b7c96779b7215eb631d6acbc44a7ac24f57c1  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python3 payload/protocol_check.py payload/protocol.json payload/matrix.json --frozen
          python3 payload/check_ablation.py
      - uses: actions/checkout@v5
        with:
          repository: integrallis/models
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models-base
      - uses: actions/checkout@v5
        with:
          repository: integrallis/models
          ref: 218daaea7b3a52e97311b56e5d950245ed917343
          path: models-candidate
      - name: Apply frozen candidate source and build exact runtimes
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          python3 payload/apply_source.py models-candidate
          (cd models-base && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime --init-script ../payload/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2)
          (cd models-candidate && ./gradlew :backend-native:cargoBuildRelease :backend-native:copyPairedRuntime :models-runtime:jar --init-script ../payload/scripts/bonsai-paired/runtime.init.gradle --no-daemon --max-workers=2)
          cp models-candidate/models-runtime/build/libs/models-runtime-0.3.59.jar models-candidate/backend-native/build/paired-runtime/
          python3 payload/build_ablation.py models-candidate ablation-source
          cargo +1.96.0 build --release --locked --offline --manifest-path ablation-source/backend-native/src/main/rust/model-kernels/Cargo.toml
          python3 payload/instrument_ablation.py ablation-source instrumented-source
          cargo +1.96.0 build --release --locked --offline --manifest-path instrumented-source/backend-native/src/main/rust/model-kernels/Cargo.toml
          python3 payload/fetch_weights.py "$RUNNER_TEMP/bonsai2.gguf"
      - name: Prepare and verify all actual artifacts
        run: |
          python3 payload/run_screen.py "$ARCH" "$PAIR" prepare --models-base models-base --models-candidate models-candidate --instrumented-library instrumented-source/backend-native/src/main/rust/model-kernels/target/release/libjmodels_kernels.so --weights "$RUNNER_TEMP/bonsai2.gguf"
          python3 payload/ablation_run.py "$ARCH" prepare --ablated ablation-source/backend-native/src/main/rust/model-kernels/target/release/libjmodels_kernels.so --instrumented instrumented-source/backend-native/src/main/rust/model-kernels/target/release/libjmodels_kernels.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-prepared
          path: evidence/
          if-no-files-found: error
      - name: fixture
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-0
          path: evidence/
          if-no-files-found: error
      - name: pair:0
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "pair:0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-1
          path: evidence/
          if-no-files-found: error
      - name: pair:1
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "pair:1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-2
          path: evidence/
          if-no-files-found: error
      - name: pair:2
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "pair:2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-3
          path: evidence/
          if-no-files-found: error
      - name: pair:3
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "pair:3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-4
          path: evidence/
          if-no-files-found: error
      - name: finish
        timeout-minutes: 80
        run: python3 payload/ablation_run.py "$ARCH" "finish"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-${{ matrix.arch }}-5
          path: evidence/
          if-no-files-found: error
  analyze:
    needs: model
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch identical frozen analysis
        env:
          PAYLOAD_URL: ${{ secrets.BF16_CAPABILITY_ABLATION_PAYLOAD_URL }}
        run: |
          curl -fL --retry 3 "$PAYLOAD_URL" -o payload.tar.gz
          echo '46164dd46c0d1e812656e617252b7c96779b7215eb631d6acbc44a7ac24f57c1  payload.tar.gz' | sha256sum -c -
          tar -xzf payload.tar.gz
          python3 payload/check_ablation.py
      - uses: actions/download-artifact@v4
        with:
          pattern: bf16-ablation-*-5
          path: collected
      - run: python3 payload/analyze_ablation.py collected ablation-analysis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf16-ablation-analysis
          path: ablation-analysis.json
          if-no-files-found: error
