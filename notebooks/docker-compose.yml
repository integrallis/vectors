services:
  jupyter:
    build:
      context: .
      dockerfile: jupyter/Dockerfile
    image: vectors-jjava:latest
    container_name: vectors-jjava
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      # Mount the repository root so Gradle can prepare the selected notebook classpath.
      - ../..:/home/jovyan/work:cached
      - vectors-notebook-gradle-cache:/home/jovyan/.gradle
    environment:
      - VECTORS_NOTEBOOK_MODE=${VECTORS_NOTEBOOK_MODE:-source}
      - VECTORS_VERSION=${VECTORS_VERSION:-0.1.2}
      - VECTORS_NOTEBOOK_REPOSITORY=${VECTORS_NOTEBOOK_REPOSITORY:-}
      - VECTORS_NOTEBOOK_PREPARE=${VECTORS_NOTEBOOK_PREPARE:-true}
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped
    working_dir: /home/jovyan/work/vectors/notebooks

volumes:
  vectors-notebook-gradle-cache:
